<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1"><title>Pantalla</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--a:#e8788f;--b:#fbe3da;--ink:#3d2b2b;color-scheme:light}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 50% 0,#fff 0,var(--b) 75%);font-family:Lora,Georgia,serif;color:var(--ink);overflow:hidden;transition:background 1s;cursor:none}
#wait{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'Dancing Script',cursive,serif;font-size:7vmin;color:var(--a);text-align:center;z-index:2}
#wait small{font-family:Lora,serif;font-size:2.4vmin;color:var(--ink);opacity:.5;margin-top:2vmin}
#wait b{font-size:12vmin;animation:hb 1.4s infinite}
#show{position:fixed;inset:0;display:none;align-items:center;justify-content:center;gap:6vw;padding:4vmin 6vw;z-index:2}
#show .l{flex:0 0 auto}#show .r{flex:1;max-width:46vw;text-align:left}
.h{font-family:'Dancing Script',cursive,serif;font-size:7vmin;color:var(--a);margin:0 0 3vmin;opacity:0;animation:up 1s .2s forwards}
.pol{background:#fff;padding:1.8vmin 1.8vmin 7vmin;width:min(52vmin,38vw);border-radius:4px;box-shadow:0 14px 40px #0003,0 0 8vmin var(--a);transform:rotate(-3deg);position:relative;opacity:0;animation:drop 1.1s .3s cubic-bezier(.2,1.3,.4,1) forwards}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:brightness(2.2) grayscale(1) blur(14px);animation:dev 4s 1.2s ease-out forwards}
.pol span{position:absolute;bottom:1.6vmin;left:0;right:0;text-align:center;font-family:'Dancing Script',cursive,serif;font-size:4.6vmin;color:var(--a)}
.t p{font-size:3.4vmin;line-height:1.55;margin:0 0 2vmin;opacity:0;animation:up .9s forwards}
.t p:nth-child(1){animation-delay:3s}.t p:nth-child(2){animation-delay:4.2s}
.pl{display:inline-block;font-family:'Dancing Script',cursive,serif;font-size:6.4vmin;color:#fff;background:var(--a);padding:.8vmin 3vmin;border-radius:40px;margin:1vmin 0 2.4vmin;box-shadow:0 8px 24px #0003;opacity:0;animation:pop 1s 5.8s cubic-bezier(.2,1.6,.4,1) forwards}
.af,.la{font-size:3.2vmin;line-height:1.55;opacity:0;animation:up 1s forwards}.af{animation-delay:7s}.la{animation-delay:8.2s;font-weight:600;color:var(--a);margin-top:2vmin}
.f{position:fixed;bottom:-60px;z-index:1;pointer-events:none;animation:fl linear forwards}
#dot{position:fixed;right:8px;bottom:8px;width:8px;height:8px;border-radius:50%;background:#bbb;opacity:.5;z-index:3}
@media (max-aspect-ratio:1/1){#show{flex-direction:column;gap:3vmin}#show .r{max-width:90vw;text-align:center}}
@keyframes hb{50%{transform:scale(1.18)}}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(8deg)}to{opacity:1;transform:rotate(-3deg)}}
@keyframes dev{to{filter:brightness(1) grayscale(0) blur(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes fl{to{transform:translateY(-120vh) rotate(40deg);opacity:0}}
</style></head><body>
<div id="wait"><b>❤️</b>Esperando el primer regalo…<small>Pulsa F11 para pantalla completa</small></div>
<div id="show"></div><div id="dot"></div>
<script>
var D={},TOPIC="mama0d477c0083934d40",E=['❤️','💕','🌸','✨','💖'],cur=null,hearts=null;
function f(){var e=document.createElement('div');e.className='f';e.textContent=E[Math.random()*5|0];
e.style.left=Math.random()*100+'vw';e.style.fontSize=(2+Math.random()*4)+'vmin';e.style.animationDuration=(6+Math.random()*6)+'s';
document.body.appendChild(e);setTimeout(function(){e.remove()},13000)}
setInterval(f,700);
function load(key){return fetch(key+'.html?t='+Date.now(),{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.text()}).then(function(t){
 var d=new DOMParser().parseFromString(t,'text/html'),c=t.match(/--a:\s*(#[0-9a-fA-F]{3,8})\s*;\s*--b:\s*(#[0-9a-fA-F]{3,8})/),
 q=function(s){var e=d.querySelector(s);return e?e.innerHTML:''},im=d.querySelector('.pol img');
 return D[key]={c1:c?c[1]:'#e8788f',c2:c?c[2]:'#fbe3da',img:im?im.getAttribute('src'):'',tag:q('.pol span'),h:q('.h'),p:q('.t'),place:q('.pl'),after:q('.af'),last:q('.la')}})}
function show(k){var s=document.getElementById('show');
 document.documentElement.style.setProperty('--a',k.c1);document.documentElement.style.setProperty('--b',k.c2);
 document.getElementById('wait').style.display='none';
 s.innerHTML='<div class="l"><div class="pol"><img src="'+k.img+'" alt=""><span>'+k.tag+'</span></div></div><div class="r"><div class="h">'+(k.h||'Un regalo para ti, mamá')+'</div><div class="t">'+k.p+'</div><div class="pl">'+k.place+'</div><div class="af">'+k.after+'</div><div class="la">'+k.last+'</div></div>';
 s.style.display='flex';for(var i=0;i<18;i++)setTimeout(f,i*120)}
function go(key){key=(key||'').trim().toLowerCase();if(['lucia','julia','laura','martin'].indexOf(key)<0)return;
 load(key).then(show,function(){if(D[key])show(D[key])})}
['lucia','julia','laura','martin'].forEach(function(k){load(k).catch(function(){})});
function reset(){document.getElementById('show').style.display='none';document.getElementById('wait').style.display='flex';document.documentElement.style.setProperty('--a','#e8788f');document.documentElement.style.setProperty('--b','#fbe3da')}
function conn(){var es;try{es=new EventSource('https://ntfy.sh/'+TOPIC+'/sse')}catch(e){setTimeout(conn,3000);return}
 es.onopen=function(){document.getElementById('dot').style.background='#6c6'};
 es.onerror=function(){document.getElementById('dot').style.background='#c66'};
 es.onmessage=function(ev){try{var m=JSON.parse(ev.data);if(m.event==='message'||m.message)go(m.message)}catch(e){}}}
conn();
document.addEventListener('keydown',function(e){var m={'1':'lucia','2':'julia','3':'laura','4':'martin'};if(m[e.key])go(m[e.key]);if(e.key==='0')reset()});
document.addEventListener('mousemove',function(){document.body.style.cursor='default';clearTimeout(window._c);window._c=setTimeout(function(){document.body.style.cursor='none'},2000)});
</script></body></html>
