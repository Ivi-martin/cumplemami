<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un mensaje de Pongo</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--a:#c9772b;--b:#fff0d9;--ink:#3d2b2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff 0,var(--b) 75%);font-family:Lora,Georgia,serif;color:var(--ink);text-align:center;overflow-x:hidden}
main{max-width:460px;margin:0 auto;padding:20px 18px 36px}
h1{font-family:'Dancing Script',cursive,serif;font-size:42px;color:var(--a);margin:0 0 4px}
p{margin:0 0 14px;font-style:italic;color:#7a4a22}
.v{position:relative;border-radius:16px;overflow:hidden;box-shadow:0 10px 32px #0004;border:3px solid #fff;background:#000}
video{display:block;width:100%;max-height:72vh;background:#000;object-fit:contain}
#go{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;border:0;width:100%;background:#0006;color:#fff;font:600 30px 'Dancing Script',cursive,serif;cursor:pointer}
#go b{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--a);font-size:36px;box-shadow:0 6px 20px #0006;animation:pu 1.4s infinite}
#snd{display:none;margin-top:14px;font:600 16px Lora,serif;color:#fff;background:var(--a);border:0;border-radius:30px;padding:10px 22px}
@keyframes pu{50%{transform:scale(1.1)}}
</style></head><body><main>
<h1>Un mensaje para ti 🐾</h1><p>Pulsa el botón y escucha con atención…</p>
<div class="v"><video id="v" src="pongo.mp4#t=0.1" playsinline preload="auto"></video>
<button id="go"><b>▶</b>Comenzar</button></div>
<button id="snd">🔊 Activar sonido en el móvil</button>
</main>
<script>
var SONIDO_EN_MOVIL=false; /* false: el sonido sale por la tele. Pon true para oírlo en el móvil. */
var T="https://ntfy.sh/mama0d477c0083934d40";
function tell(m){try{fetch(T,{method:"POST",body:m}).catch(function(){})}catch(e){}}
var v=document.getElementById('v'),go=document.getElementById('go'),snd=document.getElementById('snd');
tell('pongo');
go.onclick=function(){go.style.display='none';v.muted=!SONIDO_EN_MOVIL;v.controls=true;v.currentTime=0;tell('pongo-play');
 v.play().catch(function(){v.muted=true;v.play()});
 if(!SONIDO_EN_MOVIL){snd.style.display='inline-block'}};
snd.onclick=function(){v.muted=false;snd.style.display='none'};
</script></body></html>
