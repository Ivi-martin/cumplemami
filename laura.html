<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una pista para mamá — Laura</title>
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600&family=Lora:ital@0;1&display=swap" rel="stylesheet">
<style>
:root{--a:#e58a6a;--b:#fdeadb;--ink:#3d2b2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,#fff 0,var(--b) 70%);font-family:Lora,Georgia,serif;color:var(--ink);overflow-x:hidden;text-align:center}
main{position:relative;z-index:2;max-width:520px;margin:0 auto;padding:28px 22px 40px}
.h{font-family:'Dancing Script',cursive,serif;font-size:34px;color:var(--a);margin:6px 0 20px;opacity:0;animation:up 1s .2s forwards}
.pol{background:#fff;padding:14px 14px 52px;width:min(78vw,330px);margin:0 auto 26px;border-radius:4px;box-shadow:0 14px 40px #0003,0 0 60px var(--a);transform:rotate(-3deg);position:relative;opacity:0;animation:drop 1.1s .5s cubic-bezier(.2,1.3,.4,1) forwards}
.pol img{display:block;width:100%;aspect-ratio:1;object-fit:cover;filter:brightness(2.2) grayscale(1) blur(14px);animation:dev 4s 1.4s ease-out forwards}
.pol span{position:absolute;bottom:12px;left:0;right:0;font-family:'Dancing Script',cursive;font-size:28px;color:var(--a)}
.pol:after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 40%,#fff9 50%,transparent 60%);background-size:250% 100%;animation:sh 3s 5s ease-in-out infinite;pointer-events:none}
.t p{font-size:19px;line-height:1.6;margin:0 0 14px;opacity:0;animation:up .9s forwards}
.t p:nth-child(1){animation-delay:3.2s}.t p:nth-child(2){animation-delay:4.4s}
.pl{display:inline-block;font-family:'Dancing Script',cursive;font-size:36px;color:#fff;background:var(--a);padding:6px 22px;border-radius:40px;margin:4px 0 16px;box-shadow:0 8px 24px #0003;opacity:0;animation:pop 1s 6s cubic-bezier(.2,1.6,.4,1) forwards}
.af,.la{opacity:0;animation:up 1s forwards;font-size:18px;line-height:1.6}.af{animation-delay:7.2s}.la{animation-delay:8.4s;font-weight:600;color:var(--a);margin-top:14px}
.f{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:fl linear forwards}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drop{from{opacity:0;transform:translateY(-60px) rotate(8deg)}to{opacity:1;transform:rotate(-3deg)}}
@keyframes dev{to{filter:brightness(1) grayscale(0) blur(0)}}
@keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:none}}
@keyframes sh{0%{background-position:150% 0}60%,100%{background-position:-50% 0}}
@keyframes fl{to{transform:translateY(-115vh) rotate(40deg);opacity:0}}
</style></head><body><main>
<div class="h">Una pista para mamá</div>
<div class="pol"><img src="Laura.jpg" alt="Laura"><span>Soy Laura</span></div>
<div class="t"><p>¡Vas genial! Ya tienes otra pista y cada vez estás más cerca. 🥰</p><p>Mi regalo ha decidido salir de casa… Lo encontrarás</p></div>
<div class="pl">en el coche 🚗</div>
<div class="af">Ponte en modo detective… y sí, esta vez tendrás que salir de casa. 😂</div><div class="la">Te quiero muchísimo, mamá. ❤️</div></main>
<script>
var E=['❤️','💕','🌸','✨','💖'];
function f(x,y){var e=document.createElement('div');e.className='f';e.textContent=E[Math.random()*5|0];
e.style.left=(x!=null?x:Math.random()*100)+'vw';if(y!=null)e.style.bottom=y+'px';
e.style.fontSize=(14+Math.random()*22)+'px';e.style.animationDuration=(6+Math.random()*6)+'s';
document.body.appendChild(e);setTimeout(function(){e.remove()},13000)}
for(var i=0;i<14;i++)setTimeout(f,i*350);setInterval(f,900);
document.addEventListener('pointerdown',function(ev){for(var i=0;i<8;i++)f(ev.clientX/innerWidth*100+(Math.random()*16-8),innerHeight-ev.clientY)});
</script></body></html>
